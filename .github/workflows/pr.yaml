name: Pull request

on:
  pull_request:

# A new push to a pull request supersedes the run on its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # rhysd/actionlint 1.7.12, which also runs shellcheck on `run:` steps.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.13"
      - run: bash tools/check-changelog.sh

  verify:
    uses: ./.github/workflows/ci.yml

  # The calibration tree package (packages/calibration-tree): its tests,
  # including the golden trees and the worker's bytes, and its typecheck. Not
  # part of ci.yml, so deployments do not wait for it.
  calibration-tree:
    name: Calibration tree package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/calibration-tree
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  # The main ruleset requires this check by name.
  required:
    name: Required checks
    if: always()
    needs: [lint-workflows, changelog, verify, calibration-tree]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success"
